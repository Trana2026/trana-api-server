spring:
  application:
    name: trana-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
  cache:
    type: caffeine
    cache-names:
      - activeTerms
    caffeine:
      spec: maximumSize=4,expireAfterWrite=10m
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-}]){faint} %clr([%X{method:-} %X{path:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

springdoc:
  swagger-ui:
    display-request-duration: true
    filter: true
    persist-authorization: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

trana:
  cors:
    allowed-origins:
      - http://localhost:3000
  guardian:
    web-base-url: ${TRANA_GUARDIAN_WEB_BASE_URL:http://localhost:3000}
  dev:
    token-key: ${TRANA_DEV_TOKEN_KEY:}
  demo:
    enabled: ${TRANA_DEMO_ENABLED:false}
    token-key: ${TRANA_DEMO_TOKEN_KEY:}
  contract:
    web:
      base-url: ${TRANA_CONTRACT_WEB_BASE_URL}
  identity:
    pass:
      key-info-base64: ${TRANA_PASS_KEY_INFO_BASE64}
      key-info-password: ${TRANA_PASS_KEY_INFO_PASSWORD}
      return-url: ${TRANA_PASS_RETURN_URL}
      mobile-ok-base-url: ${TRANA_PASS_MOBILE_OK_BASE_URL}
  alimtalk:
    aligo:
      tpl-code:
        new-contract: UJ_8650
        receiver-signed: UJ_8653
        revision-requested: UJ_8672
        completed: UJ_8671
        dispute-reported: UJ_9113
        dispute-filed-receipt: UJ_9112
        cancellation-requested: UJ_9111
        cancellation-revoked: UK_0598
        guardian-contract-completed: UJ_8821
        expiry-warning: UJ_9524
        expiry-deleted-requester: UJ_9527
        expiry-deleted-unsigned: UJ_9529
        emtitle-new-contract: "계약 서명 요청"
        emtitle-receiver-signed: "최종 서명 요청"
        emtitle-revision-requested: "계약 수정 요청"
        emtitle-completed: "계약 최종 완료"
        emtitle-guardian-contract-completed: "계약 체결 안내"
        emtitle-expiry-warning: "계약 만료 안내"
        emtitle-expiry-deleted: "계약 삭제 안내"
      test-mode: true
  slack:
    webhook-url: ${TRANA_SLACK_WEBHOOK_URL:}
  analytics:
    amplitude:
      api-key: ${TRANA_ANALYTICS_AMPLITUDE_API_KEY:}
    ga4:
      measurement-id: ${TRANA_ANALYTICS_GA4_MEASUREMENT_ID:}
      firebase-app-id: ${TRANA_ANALYTICS_GA4_FIREBASE_APP_ID:}
      api-secret: ${TRANA_ANALYTICS_GA4_API_SECRET:}
